<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif;
            /* استدعاء الصورة هنا */
            background: url('vio.jpg') no-repeat center center fixed; 
            background-size: cover; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        .card { 
            width: 100%; max-width: 600px;
            background: rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px; padding: 25px; margin: 10px 0;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; color: white;
            transition: 0.3s;
            backdrop-filter: blur(10px);
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .card:active { transform: scale(0.97); border-color: #d4af37; }
    </style>
</head>
<body>

    <div id="app" style="width: 100%; max-width: 600px; margin-top: 50px;"></div>

    <script>
        const duas = [
            { name: "دعاء الرزق والفرج العاجل", file: "دعاء_الرزق_والفرج_العاجل.mp3" },
            { name: "دعاء التوبة (بصوت المنشد ياسر المطر)", file: "دعاء_التوبه_بصوت_المنشد_ياسر_المطر.mp3" },
            { name: "دعاء الرزق والفرج (بصوت ينسي)", file: "دعاء_الرزق_والفرج_بصوت_ينسي.mp3" },
            { name: "دعاء جميل (بصوت الأستاذ أحمد المطري)", file: "دعاء_جميل_بصوت_الاستاذ_احمد_المطري.mp3" },
            { name: "دعاء كميل (بصوت أحمد المطري)", file: "دعاء_كميل__احمد_المطري.mp3" },
            { name: "دعاء يخفف همومك (بصوت المنشد)", file: "دعاء_يخفف_همومك_بصوت_المنشد.mp3" }
        ];

        const app = document.getElementById('app');
        let currentAudio = null;

        duas.forEach((dua) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerText = dua.name;
            
            card.onclick = () => {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }
                currentAudio = new Audio(dua.file);
                currentAudio.play();
            };
            app.appendChild(card);
        });
    </script>
</body>
</html>
